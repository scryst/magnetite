<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magnetite share card</title>
<!--
  The source of site/og.png, the picture every Slack, iMessage and X unfurl of
  the site shows: the page's headline over a frame of the film with lyrics on
  screen. og-frame.webp is that frame:
    ffmpeg -ss <t> -i site/media/demo.mp4 -frames:v 1 frame.png && cwebp -q 90 frame.png -o site/test/og-frame.webp

  Render it at the card's size, served (fonts do not load from file://):
    python3 site/serve.py 4174 &
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --hide-scrollbars --window-size=1200,630 --screenshot=site/og.png \
      http://localhost:4174/test/og.html
-->
<link rel="stylesheet" href="../css/type.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
  body { position: relative; color: #F2F0EB; -webkit-font-smoothing: antialiased; }
  h1 {
    position: absolute; top: 64px; left: 0; right: 0; margin: 0;
    text-align: center;
    font: 600 64px/1 'Geist', sans-serif;
    letter-spacing: -0.045em;
  }
  img {
    position: absolute; left: 50%; top: 190px; width: 760px; height: auto;
    transform: translateX(-50%);
  }
</style>
</head>
<body>
<h1>Your MacBook’s notch,<br>now a music player.</h1>
<img src="og-frame.webp" alt="" width="800" height="512">
</body>
</html>
