<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Magnetite share card</title>
<!--
  The source of site/og.png, the picture every Slack, iMessage and X unfurl of
  the site shows: the page's headline over a frame of the film. og-frame.webp
  is the film at 9 s, where the liquid pulls hardest:
    ffmpeg -ss 9 -i site/media/demo.mp4 -frames:v 1 frame.png && cwebp -q 90 frame.png -o site/test/og-frame.webp

  Render it at the card's size, served (fonts do not load from file://):
    python3 site/serve.py 4174 &
    "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --headless \
      --hide-scrollbars --window-size=1200,630 --screenshot=site/og.png \
      http://localhost:4174/test/og.html
-->
<link rel="stylesheet" href="../css/type.css">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #000; }
  body { position: relative; color: #F3F4F8; -webkit-font-smoothing: antialiased; }
  .glow {
    position: absolute; left: 50%; top: 300px; width: 1100px; height: 520px;
    transform: translateX(-50%);
    background: radial-gradient(closest-side, rgb(143 174 255 / 0.32), rgb(169 139 255 / 0.14) 55%, transparent);
    filter: blur(20px);
  }
  h1 {
    position: absolute; top: 66px; left: 0; right: 0; margin: 0;
    text-align: center;
    font: 800 88px/0.9 'Archivo', sans-serif;
    font-stretch: 125%;
    letter-spacing: -0.04em;
  }
  img {
    position: absolute; left: 50%; bottom: -8px; width: 980px; height: auto;
    transform: translateX(-50%);
    border-radius: 0 0 40px 40px;
  }
</style>
</head>
<body>
<div class="glow"></div>
<h1>Music, magnetized.</h1>
<img src="og-frame.webp" alt="" width="1600" height="700">
</body>
</html>
